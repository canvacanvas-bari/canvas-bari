<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Bari - Wholesale Shop</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .grid-item { border: 2px solid #ddd; border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; background: #fff; transition: 0.3s; }
        .grid-item.selected { border-color: #27ae60; background: #e8f8f5; }
        .wholesale-highlight { background: #fffae6; border: 1px dashed #f39c12; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: bold; color: #d35400; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background-color: #27ae60; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #219653; }
        .price-summary { background: #f1f8ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 Canvas Bari - পাইকারি শপ</h2>

    <!-- পাইকারি রেট হাইলাইট -->
    <div class="wholesale-highlight">
        🔥 পাইকারি মূল্যে সেরা কালেকশন! বেশি কিনলে সাশ্রয়ী মূল্য।
    </div>

    <!-- সাইজ বা গ্রিড সিলেকশন -->
    <div style="margin-bottom: 10px; font-weight: bold;">১. সাইজ বা ক্যাটাগরি সিলেক্ট করুন:</div>
    <div class="grid-container" id="productGrid">
        <!-- জাভাস্ক্রিপ্ট দিয়ে গ্রিড লোড হবে -->
    </div>

    <!-- মূল্য তালিকা -->
    <div class="price-summary">
        <p style="margin: 0 0 5px 0;">নির্বাচিত প্রডাক্ট: <strong id="displayProduct">-</strong></p>
        <p style="margin: 0 0 5px 0;"><span id="rateTypeTag" style="color: #c0392b; font-weight: bold;">পাইকারি রেট</span></p>
        <p style="margin: 0 0 5px 0;">প্রতি পিস দাম: ৳<span id="displayUnitPrice">0</span></p>
        <p style="margin: 0; font-size: 16px;">সর্বমোট দাম: ৳<span id="displayTotal">0</span></p>
    </div>

    <!-- ফর্ম এবং হোয়াটসঅ্যাপ অর্ডার সাবমিশন -->
    <form onsubmit="sendOrderToWhatsApp(event)">
        <div class="form-group">
            <label>পরিমাণ (পিস):</label>
            <input type="number" id="displayQty" value="1" min="1" oninput="updateCalculation()">
        </div>

        <div style="font-weight: bold; margin-bottom: 8px; color: #2980b9;">৩. আপনার তথ্য দিন:</div>
        
        <div class="form-group">
            <label>আপনার নাম *</label>
            <input type="text" id="customerName" placeholder="আপনার নাম লিখুন" required>
        </div>

        <div class="form-group">
            <label>মোবাইল নম্বর *</label>
            <input type="tel" id="customerPhone" placeholder="আপনার মোবাইল নম্বর" required>
        </div>

        <div class="form-group">
            <label>পূর্ণাঙ্গ ঠিকানা (বাসা নং, রোড, থানা, জেলা) *</label>
            <textarea id="customerAddress" rows="3" placeholder="আপনার সম্পূর্ণ ঠিকানা দিন" required></textarea>
        </div>

        <!-- হিডেন ইনপুট ফিল্ডস -->
        <input type="hidden" id="finalUnitPriceInput" value="0">
        <input type="hidden" id="totalPriceInput" value="0">

        <button type="submit">🛒 অর্ডার কনফার্ম করুন (সরাসরি হোয়াটসঅ্যাপে)</button>
    </form>
</div>

<script>
    // আগের আসল প্রডাক্ট ও পাইকারি রেটের ডাটা
    const products = [
        { name: "Standard Canvas (Small)", price: 25, type: "পাইকারি রেট" },
        { name: "Premium Canvas (Large)", price: 45, type: "পাইকারি রেট" }
    ];

    let selectedProduct = products[0];

    function renderGrid() {
        let gridHtml = '';
        products.forEach((p, index) => {
            let isSelected = (selectedProduct.name === p.name) ? 'selected' : '';
            gridHtml += `<div class="grid-item ${isSelected}" onclick="selectProduct(${index})">
                <strong>${p.name}</strong><br>
                <span style="color: #e74c3c; font-weight: bold;">৳${p.price}</span>
            </div>`;
        });
        document.getElementById('productGrid').innerHTML = gridHtml;
        updateCalculation();
    }

    function selectProduct(index) {
        selectedProduct = products[index];
        renderGrid();
    }

    function updateCalculation() {
        let qty = parseInt(document.getElementById('displayQty').value) || 1;
        let unitPrice = selectedProduct.price;
        let total = qty * unitPrice;

        document.getElementById('displayProduct').innerText = selectedProduct.name;
        document.getElementById('rateTypeTag').innerText = selectedProduct.type;
        document.getElementById('displayUnitPrice').innerText = unitPrice;
        document.getElementById('displayTotal').innerText = total;
        document.getElementById('finalUnitPriceInput').value = unitPrice;
        document.getElementById('totalPriceInput').value = total;
    }

    // সরাসরি হোয়াটসঅ্যাপে অর্ডার পাঠানোর ফাংশন
    function sendOrderToWhatsApp(event) {
        event.preventDefault();

        let customerName = document.getElementById('customerName').value;
        let customerPhone = document.getElementById('customerPhone').value;
        let customerAddress = document.getElementById('customerAddress').value;
        let productName = selectedProduct.name;
        let productQty = document.getElementById('displayQty').value;
        let unitPrice = document.getElementById('finalUnitPriceInput').value;
        let totalPrice = document.getElementById('totalPriceInput').value;

        // আপনার হোয়াটসঅ্যাপ নম্বর (কান্ট্রি কোড সহ)
        let myWhatsAppNumber = "8801603538204"; 

        let message = `🛒 নতুন পাইকারি অর্ডার এসেছে!%0A%0A` +
                      `📦 প্রডাক্ট: ${productName}%0A` +
                      `👤 নাম: ${customerName}%0A` +
                      `📞 ফোন: ${customerPhone}%0A` +
                      `📍 ঠিকানা: ${customerAddress}%0A` +
                      `🔢 পরিমাণ: ${productQty} পিস%0A` +
                      `💰 প্রতি পিস: ৳${unitPrice}%0A` +
                      `💵 মোট দাম: ৳${totalPrice}`;

        let url = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
        window.open(url, '_blank');
    }

    renderGrid();
</script>

</body>
</html>
