<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Bari - Art Supplies Store</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* 3D Product Card Hover Animation */
    .product-card {
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: none;
      border-radius: 15px;
      overflow: hidden;
      background: #ffffff;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    
    .product-card:hover {
      transform: translateY(-8px) rotateX(2deg) rotateY(2deg);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    .like-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e63946;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 4px 8px rgba(0,0,0,0.12);
    }

    .combo-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #ffb703;
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      z-index: 10;
    }

    .price-retail {
      font-size: 1.2rem;
      color: #2b9348;
      font-weight: 700;
    }

    .price-wholesale {
      font-size: 0.85rem;
      color: #0077b6;
      font-weight: 600;
    }

    .category-btn {
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: 500;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="#">🎨 Canvas Bari</a>
      <a id="nav-wa-btn" href="https://wa.me/8801700000000" target="_blank" class="btn btn-success btn-sm rounded-pill px-3">
        <i class="fab fa-whatsapp me-1"></i> WhatsApp Order
      </a>
    </div>
  </nav>

  <!-- Banner -->
  <div class="text-white text-center py-4 mb-4" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
    <div class="container">
      <h2 class="fw-bold mb-1">Canvas Bari - Art Supplies Store</h2>
      <p class="mb-0 small opacity-75">পাইকারি ও খুচরা ক্যানভাস এবং আর্ট সামগ্রী সরাসরি অর্ডার করুন</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container my-3">
    <!-- Category Filter -->
    <div class="d-flex overflow-auto pb-3 mb-3" id="category-buttons" style="scrollbar-width: none;">
      <button class="btn btn-dark category-btn me-2 active" onclick="filterCategory('All', this)">All Products</button>
    </div>

    <!-- Product Grid -->
    <div class="row g-4" id="product-container">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">প্রোডাক্ট লোড হচ্ছে...</p>
      </div>
    </div>
  </div>

  <script>
    // আপনার গুগল শিটের আইডি ও তথ্য
    const SHEET_ID = '1j0d3LpbXp9WXSK9hPSzCmP7X8UkQ6o7eFcUw1zbIauw';
    const PHONE_NUMBER = '8801700000000'; // আপনার আসল হোয়াটসঅ্যাপ নাম্বার এখানে দিন

    const API_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;

    let allProducts = [];

    // আপনার গুগল শিটে থাকা ৩টি আসল প্রোডাক্টের ডাটা (গুগল নেটওয়ার্ক এরর হলে এগুলো অটো লোড হবে)
    const backupProducts = [
      {
        code: "CB-SQ-01",
        size: "4/4\" Square Canvas",
        retail: 25,
        wholesale: 15,
        image: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=400&auto=format&fit=crop",
        category: "Square Canvas",
        desc: "100% Cotton, Heavy Wood Frame",
        minOrder: 10,
        isCombo: false
      },
      {
        code: "CB-ES-01",
        size: "5-Feet Easel Stand",
        retail: 850,
        wholesale: 650,
        image: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=400&auto=format&fit=crop",
        category: "Easel Stand",
        desc: "Pine Wood, Adjustable Height",
        minOrder: 1,
        isCombo: false
      },
      {
        code: "CB-COMBO-01",
        size: "Artist Beginner Combo",
        retail: 500,
        wholesale: 380,
        image: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=400&auto=format&fit=crop",
        category: "Combo Offer",
        desc: "3 Canvases (4/4, 6/6, 8/8) + 1 Mini Easel",
        minOrder: 1,
        isCombo: true
      }
    ];

    async function loadProducts() {
      try {
        const response = await fetch(API_URL);
        const text = await response.text();
        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
        
        if (match && match[1]) {
          const parsed = JSON.parse(match[1]);
          const rows = parsed.table.rows;

          allProducts = rows.map(r => {
            const c = r.c || [];
            let img = c[4]?.v || '';
            if (!img.startsWith('http')) {
              img = 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=400&auto=format&fit=crop';
            }
            return {
              code: c[0]?.v || '',
              size: c[1]?.v || 'Standard Size',
              retail: c[2]?.v || 0,
              wholesale: c[3]?.v || 0,
              image: img,
              category: c[5]?.v || 'General',
              desc: c[6]?.v || '',
              minOrder: c[8]?.v || 1,
              isCombo: String(c[12]?.v || '').toLowerCase() === 'yes'
            };
          });

          if (allProducts.length === 0) allProducts = backupProducts;
        } else {
          allProducts = backupProducts;
        }
      } catch (e) {
        console.warn('Falling back to sheet data:', e);
        allProducts = backupProducts;
      }

      renderCategories();
      renderProducts(allProducts);
    }

    function renderProducts(items) {
      const container = document.getElementById('product-container');
      container.innerHTML = '';

      items.forEach(p => {
        const waText = encodeURIComponent(`হ্যালো! আমি "Canvas Bari" থেকে অর্ডার করতে চাই:\n\n📌 *প্রোডাক্ট:* ${p.size}\n🏷️ *কোড:* ${p.code}\n💰 *খুচরা মূল্য:* ৳${p.retail}`);
        
        const card = `
          <div class="col-6 col-md-4 col-lg-3">
            <div class="card product-card h-100 p-2 shadow-sm position-relative">
              <div class="like-btn" onclick="toggleHeart(this)">
                <i class="fa-regular fa-heart"></i>
              </div>
              ${p.isCombo ? '<span class="combo-badge">🎁 Combo</span>' : ''}
              <img src="${p.image}" class="card-img-top rounded" alt="${p.size}" style="height: 160px; object-fit: cover;">
              <div class="card-body p-2 d-flex flex-column justify-content-between">
                <div>
                  <h6 class="card-title mb-1 fw-bold text-dark">${p.size}</h6>
                  <small class="text-muted d-block mb-2" style="font-size: 0.75rem;">${p.desc}</small>
                </div>
                <div>
                  <div class="price-retail">৳${p.retail} <span class="fs-6 text-muted fw-normal">/খুচরা</span></div>
                  <div class="price-wholesale mb-2">পাইকারি: ৳${p.wholesale} (নূন্যতম: ${p.minOrder}টি)</div>
                  <a href="https://wa.me/${PHONE_NUMBER}?text=${waText}" target="_blank" class="btn btn-sm btn-outline-success w-100 fw-bold">
                    <i class="fab fa-whatsapp me-1"></i> Order Now
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function renderCategories() {
      const categories = ['All', ...new Set(allProducts.map(p => p.category))];
      const catContainer = document.getElementById('category-buttons');
      catContainer.innerHTML = categories.map((c, i) => `
        <button class="btn btn-outline-dark category-btn me-2 ${i === 0 ? 'btn-dark active' : ''}" onclick="filterCategory('${c}', this)">${c}</button>
      `).join('');
    }

    function filterCategory(cat, btn) {
      if (btn) {
        document.querySelectorAll('.category-btn').forEach(b => {
          b.classList.remove('active', 'btn-dark');
          b.classList.add('btn-outline-dark');
        });
        btn.classList.remove('btn-outline-dark');
        btn.classList.add('btn-dark', 'active');
      }

      if (cat === 'All') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category === cat));
    }

    function toggleHeart(btn) {
      const icon = btn.querySelector('i');
      icon.classList.toggle('fa-solid');
      icon.classList.toggle('fa-regular');
    }

    loadProducts();
  </script>
</body>
</html>
