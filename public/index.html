<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Bari - হোলসেল ও পাইকারি শপ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .wholesale-badge {
            background: #e74c3c;
            color: white;
            padding: 8px 12px;
            text-align: center;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 16px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .price-box {
            background: #eaf2f8;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid #3498db;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 Canvas Bari</h2>
    
    <!-- পাইকারি অফার ও আকর্ষণীয় ব্যাজ -->
    <div class="wholesale-badge">
        🔥 ধামাকা অফার: পাইকারি রেট কিনুন, লাভ বেশি করুন! 🔥
    </div>

    <div class="price-box">
        <p style="margin: 0; font-size: 15px;">📦 <strong>পাইকারি মূল্য তালিকা:</strong></p>
        <p style="margin: 5px 0 0 0; color: #c0392b; font-weight: bold;" id="rateTypeTag">রেট: পাইকারি ভলিউম প্রাইস প্রযোজ্য</p>
        <p style="margin: 5px 0 0 0;">প্রতি পিস দাম: ৳<span id="displayUnitPrice">25</span></p>
        <p style="margin: 5px 0 0 0; font-size: 16px;">সর্বমোট দাম: ৳<span id="displayTotal">25</span></p>
    </div>

    <!-- অর্ডার ফর্ম -->
    <form onsubmit="sendOrderToWhatsApp(event)">
        <div class="form-group">
            <label>পরিমাণ (পিস):</label>
            <input type="number" id="displayQty" value="1" min="1" oninput="calculateTotal()">
        </div>

        <h3 style="font-size: 15px; margin-bottom: 8px; color: #2980b9;">৩. আপনার তথ্য দিন:</h3>
        
        <div class="form-group">
            <label>আপনার নাম *</label>
            <input type="text" id="customerName" placeholder="আপনার নাম লিখুন" required>
        </div>

        <div class="form-group">
            <label>মোবাইল নম্বর *</label>
            <input type="tel" id="customerPhone" placeholder="আপনার মোবাইল নম্বর" required>
        </div>

        <div class="form-group">
            <label>পূর্ণাঙ্গ ঠিকানা (বাসা নং, রোড, থানা, জেলা) *</label>
            <textarea id="customerAddress" rows="3" placeholder="আপনার সম্পূর্ণ ঠিকানা দিন" required></textarea>
        </div>

        <button type="submit">🛒 অর্ডার কনফার্ম করুন (হোয়াটসঅ্যাপ)</button>
    </form>
</div>

<script>
    function calculateTotal() {
        let qty = document.getElementById('displayQty').value;
        let unitPrice = 25; // পাইকারি ইউনিট প্রাইস
        let total = qty * unitPrice;
        document.getElementById('displayTotal').innerText = total;
    }

    function sendOrderToWhatsApp(event) {
        event.preventDefault();
        
        let customerName = document.getElementById('customerName').value;
        let customerPhone = document.getElementById('customerPhone').value;
        let customerAddress = document.getElementById('customerAddress').value;
        let productQty = document.getElementById('displayQty').value;
        let totalPrice = document.getElementById('displayTotal').innerText;
        
        // আপনার হোয়াটসঅ্যাপ নম্বর (কান্ট্রি কোড সহ)
        let myWhatsAppNumber = "8801603538204"; 
        
        let message = `🛒 নতুন পাইকারি অর্ডার এসেছে!%0A%0A` +
                      `👤 নাম: ${customerName}%0A` +
                      `📞 ফোন: ${customerPhone}%0A` +
                      `📍 ঠিকানা: ${customerAddress}%0A` +
                      `📦 পরিমাণ: ${productQty} পিস%0A` +
                      `💰 মোট দাম: ৳${totalPrice}`;
                      
        let url = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
