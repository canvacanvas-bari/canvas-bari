<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Bari - Multi Order Wholesale Shop</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-top: 5px; margin-bottom: 10px; }
        .wholesale-highlight { background: #fffae6; border: 1px dashed #f39c12; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: bold; color: #d35400; font-size: 14px; }
        
        /* প্রোডাক্ট টেবিল/গ্রিড স্টাইল */
        .product-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; max-height: 400px; overflow-y: auto; padding-right: 5px; border: 1px solid #eee; padding: 10px; border-radius: 8px; }
        .product-card { border: 1px solid #ddd; border-radius: 8px; padding: 8px; background: #fafafa; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card.active { border-color: #27ae60; background: #e8f8f5; }
        .size-title { font-weight: bold; font-size: 15px; color: #2c3e50; margin-bottom: 4px; }
        .price-text { font-size: 12px; color: #555; margin-bottom: 6px; }
        .price-text span { color: #e74c3c; font-weight: bold; }
        .qty-input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 14px; font-weight: bold; box-sizing: border-box; }
        
        .price-summary { background: #eaf2f8; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #3498db; }
        .badge-wholesale { color: #27ae60; font-weight: bold; }
        .badge-retail { color: #e67e22; font-weight: bold; }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background-color: #27ae60; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #219653; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 Canvas Bari</h2>

    <div class="wholesale-highlight">
        💥 মোট 50 পিস বা তার বেশি ক্যানভাস কিনলেই সবগুলোতেই পাইকারি দাম পাবেন!
    </div>

    <div style="font-weight: bold; margin-bottom: 8px; color: #2c3e50;">১. পছন্দের সাইজগুলোর পাশে পরিমাণ (পিস) লিখুন:</div>
    
    <!-- সব সাইজের কার্ড লিস্ট -->
    <div class="product-list" id="productList">
        <!-- জাভাস্ক্রিপ্ট দিয়ে কার্ডগুলো বসবে -->
    </div>

    <!-- মোট হিসাব -->
    <div class="price-summary">
        <p style="margin: 0 0 5px 0;">মোট নির্বাচন: <strong id="totalItemCount">০ পিস</strong></p>
        <p style="margin: 0 0 5px 0;">রেটের ধরন: <span id="rateTypeTag" class="badge-retail">খুচরা রেট</span></p>
        <p style="margin: 0; font-size: 16px; font-weight: bold;">সর্বমোট দাম: ৳<span id="displayTotal">0</span></p>
    </div>

    <!-- কাস্টমার তথ্য ফর্ম -->
    <form onsubmit="sendOrderToWhatsApp(event)">
        <div style="font-weight: bold; margin-bottom: 8px; color: #2980b9;">২. আপনার ডেলিভারি তথ্য দিন:</div>
        
        <div class="form-group">
            <label>আপনার নাম *</label>
            <input type="text" id="customerName" placeholder="আপনার নাম লিখুন" required>
        </div>

        <div class="form-group">
            <label>মোবাইল নম্বর *</label>
            <input type="tel" id="customerPhone" placeholder="আপনার মোবাইল নম্বর" required>
        </div>

        <div class="form-group">
            <label>পূর্ণাঙ্গ ঠিকানা (বাসা নং, রোড, থানা, জেলা) *</label>
            <textarea id="customerAddress" rows="2" placeholder="আপনার সম্পূর্ণ ঠিকানা দিন" required></textarea>
        </div>

        <button type="submit">🛒 অর্ডার কনফার্ম করুন (হোয়াটসঅ্যাপ)</button>
    </form>
</div>

<script>
    // ২৮টি সাইজের তালিকা
    const priceList = [
        { size: '4/4', retail: 25, wholesale: 15 },
        { size: '5/5', retail: 30, wholesale: 20 },
        { size: '6/6', retail: 30, wholesale: 20 },
        { size: '6/8', retail: 35, wholesale: 25 },
        { size: '4/6', retail: 30, wholesale: 20 },
        { size: '6/10', retail: 35, wholesale: 30 },
        { size: '6/12', retail: 40, wholesale: 30 },
        { size: '8/8', retail: 40, wholesale: 30 },
        { size: '8/10', retail: 45, wholesale: 35 },
        { size: '8/12', retail: 45, wholesale: 35 },
        { size: '8/16', retail: 50, wholesale: 40 },
        { size: '10/10', retail: 45, wholesale: 40 },
        { size: '10/12', retail: 50, wholesale: 40 },
        { size: '10/14', retail: 60, wholesale: 45 },
        { size: '12/12', retail: 60, wholesale: 45 },
        { size: '12/14', retail: 60, wholesale: 45 },
        { size: '12/16', retail: 70, wholesale: 55 },
        { size: '12/18', retail: 70, wholesale: 60 },
        { size: '12/20', retail: 80, wholesale: 70 },
        { size: '12/24', retail: 100, wholesale: 80 },
        { size: '16/20', retail: 90, wholesale: 75 },
        { size: '16/24', retail: 120, wholesale: 100 },
        { size: '18/24', retail: 140, wholesale: 110 },
        { size: '20/24', retail: 150, wholesale: 120 },
        { size: '20/30', retail: 180, wholesale: 140 },
        { size: '24/30', retail: 200, wholesale: 160 },
        { size: '24/36', retail: 220, wholesale: 180 },
        { size: '30/36', retail: 260, wholesale: 200 }
    ];

    // প্রোডাক্ট লিস্ট তৈরি করা
    function renderProducts() {
        const container = document.getElementById('productList');
        let html = '';
        priceList.forEach((item, index) => {
            html += `
            <div class="product-card" id="card-${index}">
                <div class="size-title">${item.size}"</div>
                <div class="price-text">খুচরা: ৳${item.retail}<br>পাইকারি: <span>৳${item.wholesale}</span></div>
                <input type="number" id="qty-${index}" class="qty-input" min="0" placeholder="0 পিস" oninput="calculateTotal()">
            </div>`;
        });
        container.innerHTML = html;
    }

    function calculateTotal() {
        let totalPcs = 0;
        
        // প্রথমে মোট পিস হিসাব করা (পাইকারি রেট পাওয়ার জন্য)
        priceList.forEach((item, index) => {
            let qty = parseInt(document.getElementById(`qty-${index}`).value) || 0;
            totalPcs += qty;
        });

        let isWholesale = (totalPcs >= 10);
        let totalPrice = 0;

        // এবার দাম হিসাব করা
        priceList.forEach((item, index) => {
            let qty = parseInt(document.getElementById(`qty-${index}`).value) || 0;
            let card = document.getElementById(`card-${index}`);
            
            if (qty > 0) {
                card.classList.add('active');
                let unitPrice = isWholesale ? item.wholesale : item.retail;
                totalPrice += (qty * unitPrice);
            } else {
                card.classList.remove('active');
            }
        });

        // ডিসপ্লে আপডেট
        document.getElementById('totalItemCount').innerText = `${totalPcs} পিস`;
        document.getElementById('displayTotal').innerText = totalPrice;

        let rateTag = document.getElementById('rateTypeTag');
        if (isWholesale) {
            rateTag.innerText = "🔥 পাইকারি রেট (১০+ পিস মোট অর্ডার)";
            rateTag.className = "badge-wholesale";
        } else {
            rateTag.innerText = "খুচরা রেট (মোট ১০ পিস কিনলে পাইকারি পাবেন)";
            rateTag.className = "badge-retail";
        }
    }

    function sendOrderToWhatsApp(event) {
        event.preventDefault();

        let totalPcs = 0;
        let selectedItems = [];

        priceList.forEach((item, index) => {
            let qty = parseInt(document.getElementById(`qty-${index}`).value) || 0;
            if (qty > 0) {
                totalPcs += qty;
                selectedItems.push({ size: item.size, qty: qty, retail: item.retail, wholesale: item.wholesale });
            }
        });

        if (selectedItems.length === 0) {
            alert("অনুগ্রহ করে কমপক্ষে যেকোনো একটি সাইজের ক্যানভাস সিলেক্ট করুন!");
            return;
        }

        let isWholesale = (totalPcs >= 10);
        let grandTotal = 0;
        let itemDetailsText = "";

        selectedItems.forEach(item => {
            let unitPrice = isWholesale ? item.wholesale : item.retail;
            let itemTotal = item.qty * unitPrice;
            grandTotal += itemTotal;
            itemDetailsText += `▫️ ${item.size}" ➡️ ${item.qty} পিস (৳${unitPrice}/পিস) = ৳${itemTotal}%0A`;
        });

        let customerName = document.getElementById('customerName').value;
        let customerPhone = document.getElementById('customerPhone').value;
        let customerAddress = document.getElementById('customerAddress').value;

        let myWhatsAppNumber = "8801603538204"; 
        let rateTypeName = isWholesale ? "🔥 পাইকারি রেট" : "খুচরা রেট";

        let message = `🛒 *নতুন অর্ডার এসেছে (Canvas Bari)*%0A%0A` +
                      `🏷️ *রেটের ধরন:* ${rateTypeName}%0A` +
                      `📦 *মোট পরিমাণ:* ${totalPcs} পিস%0A%0A` +
                      `📋 *আইটেম লিস্ট:*%0A${itemDetailsText}%0A` +
                      `💵 *সর্বমোট দাম:* ৳${grandTotal}%0A%0A` +
                      `👤 *কাস্টমার নাম:* ${customerName}%0A` +
                      `📞 *ফোন:* ${customerPhone}%0A` +
                      `📍 *ঠিকানা:* ${customerAddress}`;

        let url = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
        window.open(url, '_blank');
    }

    renderProducts();
</script>

</body>
</html>
