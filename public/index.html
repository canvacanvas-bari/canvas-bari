<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Bari - Order Page</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 15px; }
        .wholesale-highlight { background: #fffae6; border: 1px dashed #f39c12; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: bold; color: #d35400; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; background-color: #27ae60; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #219653; }
        .price-summary { background: #eaf2f8; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #3498db; }
        .badge-wholesale { color: #27ae60; font-weight: bold; }
        .badge-retail { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 Canvas Bari</h2>

    <div class="wholesale-highlight">
        💥 ১০ পিস বা তার বেশি অর্ডার করলেই পাবেন আকর্ষনীয় পাইকারি দাম!
    </div>

    <!-- সাইজ সিলেকশন -->
    <div class="form-group">
        <label>১. ক্যানভাসের সাইজ সিলেক্ট করুন (ইঞ্চি):</label>
        <select id="canvasSize" onchange="updateCalculation()">
            <!-- জাভাস্ক্রিপ্ট দিয়ে অপশন লোড হবে -->
        </select>
    </div>

    <!-- পরিমাণ -->
    <div class="form-group">
        <label>২. পরিমাণ (পিস):</label>
        <input type="number" id="displayQty" value="1" min="1" oninput="updateCalculation()">
    </div>

    <!-- প্রাইস সামারি -->
    <div class="price-summary">
        <p style="margin: 0 0 5px 0;">রেটের ধরন: <span id="rateTypeTag" class="badge-retail">খুচরা রেট</span></p>
        <p style="margin: 0 0 5px 0;">প্রতি পিস দাম: ৳<span id="displayUnitPrice">0</span></p>
        <p style="margin: 0; font-size: 16px; font-weight: bold;">সর্বমোট দাম: ৳<span id="displayTotal">0</span></p>
    </div>

    <!-- কাস্টমার ফর্ম -->
    <form onsubmit="sendOrderToWhatsApp(event)">
        <div style="font-weight: bold; margin-bottom: 8px; color: #2980b9;">৩. আপনার তথ্য দিন:</div>
        
        <div class="form-group">
            <label>আপনার নাম *</label>
            <input type="text" id="customerName" placeholder="আপনার নাম লিখুন" required>
        </div>

        <div class="form-group">
            <label>মোবাইল নম্বর *</label>
            <input type="tel" id="customerPhone" placeholder="আপনার মোবাইল নম্বর" required>
        </div>

        <div class="form-group">
            <label>পূর্ণাঙ্গ ঠিকানা (বাসা নং, রোড, থানা, জেলা) *</label>
            <textarea id="customerAddress" rows="3" placeholder="আপনার সম্পূর্ণ ঠিকানা দিন" required></textarea>
        </div>

        <button type="submit">🛒 অর্ডার কনফার্ম করুন (হোয়াটসঅ্যাপ)</button>
    </form>
</div>

<script>
    // আপনার সমস্ত ২৮টি সাইজের খুচরা ও পাইকারি তালিকা
    const priceList = [
        { size: '4/4', retail: 25, wholesale: 15 },
        { size: '5/5', retail: 30, wholesale: 20 },
        { size: '6/6', retail: 30, wholesale: 20 },
        { size: '6/8', retail: 35, wholesale: 25 },
        { size: '4/6', retail: 30, wholesale: 20 },
        { size: '6/10', retail: 35, wholesale: 30 },
        { size: '6/12', retail: 40, wholesale: 30 },
        { size: '8/8', retail: 40, wholesale: 30 },
        { size: '8/10', retail: 45, wholesale: 35 },
        { size: '8/12', retail: 45, wholesale: 35 },
        { size: '8/16', retail: 50, wholesale: 40 },
        { size: '10/10', retail: 45, wholesale: 40 },
        { size: '10/12', retail: 50, wholesale: 40 },
        { size: '10/14', retail: 60, wholesale: 45 },
        { size: '12/12', retail: 60, wholesale: 45 },
        { size: '12/14', retail: 60, wholesale: 45 },
        { size: '12/16', retail: 70, wholesale: 55 },
        { size: '12/18', retail: 70, wholesale: 60 },
        { size: '12/20', retail: 80, wholesale: 70 },
        { size: '12/24', retail: 100, wholesale: 80 },
        { size: '16/20', retail: 90, wholesale: 75 },
        { size: '16/24', retail: 120, wholesale: 100 },
        { size: '18/24', retail: 140, wholesale: 110 },
        { size: '20/24', retail: 150, wholesale: 120 },
        { size: '20/30', retail: 180, wholesale: 140 },
        { size: '24/30', retail: 200, wholesale: 160 },
        { size: '24/36', retail: 220, wholesale: 180 },
        { size: '30/36', retail: 260, wholesale: 200 }
    ];

    // ড্রপডাউনে সাইজসমূহ বসানো
    const selectElem = document.getElementById('canvasSize');
    priceList.forEach((item, index) => {
        let opt = document.createElement('option');
        opt.value = index;
        opt.innerText = `${item.size} inch (খুচরা ৳${item.retail} / পাইকারি ৳${item.wholesale})`;
        selectElem.appendChild(opt);
    });

    function updateCalculation() {
        let selectedIndex = document.getElementById('canvasSize').value;
        let qty = parseInt(document.getElementById('displayQty').value) || 1;
        let item = priceList[selectedIndex];

        let unitPrice = (qty >= 10) ? item.wholesale : item.retail;
        let total = qty * unitPrice;

        let rateTag = document.getElementById('rateTypeTag');
        if (qty >= 10) {
            rateTag.innerText = "🔥 পাইকারি রেট (১০+ পিস)";
            rateTag.className = "badge-wholesale";
        } else {
            rateTag.innerText = "খুচরা রেট (১০ পিসে পাইকারি পাবেন)";
            rateTag.className = "badge-retail";
        }

        document.getElementById('displayUnitPrice').innerText = unitPrice;
        document.getElementById('displayTotal').innerText = total;
    }

    function sendOrderToWhatsApp(event) {
        event.preventDefault();

        let selectedIndex = document.getElementById('canvasSize').value;
        let item = priceList[selectedIndex];
        let qty = document.getElementById('displayQty').value;
        let unitPrice = document.getElementById('displayUnitPrice').innerText;
        let totalPrice = document.getElementById('displayTotal').innerText;
        let rateType = (qty >= 10) ? "পাইকারি রেট" : "খুচরা রেট";

        let customerName = document.getElementById('customerName').value;
        let customerPhone = document.getElementById('customerPhone').value;
        let customerAddress = document.getElementById('customerAddress').value;

        let myWhatsAppNumber = "8801603538204"; 

        let message = `🛒 নতুন অর্ডার এসেছে!%0A%0A` +
                      `📐 সাইজ: ${item.size} ইঞ্চি%0A` +
                      `🏷️ রেটের ধরন: ${rateType}%0A` +
                      `🔢 পরিমাণ: ${qty} পিস%0A` +
                      `💰 প্রতি পিস: ৳${unitPrice}%0A` +
                      `💵 সর্বমোট দাম: ৳${totalPrice}%0A%0A` +
                      `👤 নাম: ${customerName}%0A` +
                      `📞 ফোন: ${customerPhone}%0A` +
                      `📍 ঠিকানা: ${customerAddress}`;

        let url = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
        window.open(url, '_blank');
    }

    // প্রথমবার হিসাব চালু করা
    updateCalculation();
</script>

</body>
</html>
